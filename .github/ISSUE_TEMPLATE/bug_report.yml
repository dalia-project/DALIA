name: "Bug Report"
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report.

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the Bug
      description: Please provide a short, but precise, description of the issue.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproducing the Issue
      description: |
        Please provide a short self-contained example that reproduces the issue,
        if not possible, please provide a gist script that reproduces the issue.
      placeholder: |
        import dalia
        << your code here >>
      render: python
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: Error Message or Unexpected Behavior
      description: |
        Please include the full error message, if there is one. Otherwise, describe what you expected as output as well as what you obtained.
    validations:
      required: true

  - type: textarea
    id: hardware_env
    attributes:
      label: Hardware and Environment Details
      description: | 
        Please specify your hardware (CPU, GPU, RAM, etc.), environment 
        configuration, and relevant package versions.
      placeholder: |
        Example:
        - CPU: Intel i7-12700K
        - GPU: NVIDIA A100
        - RAM: 32GB
        - OS: Ubuntu 22.04
      render: text
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: e.g. 3.11
    validations:
      required: true

  - type: input
    id: dalia_version
    attributes:
      label: Dalia version
      description: e.g. 0.1.0
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Please add any other relevant context about the problem here.
    validations:
      required: false
